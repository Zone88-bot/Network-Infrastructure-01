! London DMZ multilayer switch (Catalyst 3560-24PS, "DMZ D1")
! Source: ICA 2 report, section 13.2, page 24
! Trunk ports carrying the DMZ VLANs between the DMZ router and access switches
!
interface FastEthernet0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface FastEthernet0/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface FastEthernet0/3
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
end
