interface FastEthernet0/1
 ! [added note] to ISP 2
 no ip address
 duplex auto
 speed auto
 ipv6 address 30AD:1000:1000:2000::2/52
 ipv6 enable
 ipv6 ospf 1 area 0
!
interface FastEthernet1/0
 description to ISP 1
 no ip address
 duplex auto
 speed auto
